spring.datasource.url= jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_DATABASE}
spring.datasource.username= ${DB_USERNAME}
spring.datasource.password= ${DB_PASSWORD}

spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation= true

# Hibernate ddl auto (create, create-drop, validate, update)
#spring.jpa.hibernate.ddl-auto= update

spring.flyway.baselineOnMigrate = true
spring.flyway.locations=classpath:/db/migrations

geoquest.url.spec = ${MINKA_URL_SPEC}
geoquest.update.url.spec = ${MINKA_UPDATE_URL_SPEC}

geoquest.execution.period = ${EXECUTION_PERIOD}

geoquest.db.initialize = ${MINKA_DB_INITIALIZE}
geoquest.initialize.url.spec = ${MINKA_INITIALIZE_URL_SPEC}

enforce.user = ${ENFORCE_USER}
enforce.password = ${ENFORCE_PASSWORD}

geoquest.basepath = ${GEOQUEST_BASEPATH}

geoquest.token = ${GEOQUEST_TOKEN}

geoquest.quests.mapping = ${GEOQUEST_QUESTS_MAPPING}
