spring.datasource.url= jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_DATABASE}
spring.datasource.username= ${DB_USERNAME}
spring.datasource.password= ${DB_PASSWORD}

spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation= true

# Hibernate ddl auto (create, create-drop, validate, update)
#spring.jpa.hibernate.ddl-auto= update

spring.flyway.baselineOnMigrate = true
spring.flyway.locations=classpath:/db/migrations

geoquest.url.spec = ${GEOQUEST_URL_SPEC:https://52north.org}
geoquest.update.url.spec = ${GEOQUEST_UPDATE_URL_SPEC:https://52north.org}

geoquest.execution.period = ${EXECUTION_PERIOD:30000}

geoquest.db.initialize = ${GEOQUEST_DB_INITIALIZE:false}
geoquest.initialize.url.spec = ${GEOQUEST_INITIALIZE_URL_SPEC:https://52north.org}

enforce.user = ${ENFORCE_USER:enforce}
enforce.password = ${ENFORCE_PASSWORD:enforce}

geoquest.basepath = ${GEOQUEST_BASEPATH:https://52north.org}

geoquest.token = ${GEOQUEST_TOKEN:test}

geoquest.quests.mapping = ${GEOQUEST_QUESTS_MAPPING:[]}
